<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>セル計算カレンダー（専用テンキー版）</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ヘッダー */
  header {
    height: 60px;
    background: #f5f5f5;
    border-bottom: 1px solid #ccc;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 15px;
    flex-shrink: 0;
  }

  /* メインコンテンツ（テーブル） */
  .main {
    flex-grow: 1;
    overflow-y: auto;
    background: #ffffff;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }

  thead {
    position: sticky;
    top: 0;
    background: #eee;
    z-index: 5;
  }

  th, td {
    border: 1px solid #ddd;
    padding: 0;
    text-align: center;
    font-size: 13px;
    height: 44px;
  }

  /* 入力欄のスタイル */
  input {
    width: 100%;
    height: 100%;
    border: none;
    font-size: 16px;
    text-align: right;
    padding: 0 8px;
    background: transparent;
    outline: none;
  }

  /* 選択中のセル強調 */
  input:focus {
    background: #fff9c4;
  }

  input[readonly] {
    background: #f0f0f0;
    color: #555;
  }

  /* フッター（テンキーエリア） */
  footer {
    height: 320px; /* テンキーの高さを確保 */
    background: #d2d4d9;
    border-top: 1px solid #aaa;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }

  .status-bar {
    height: 30px;
    background: #fff;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 10px;
    font-size: 12px;
    border-bottom: 1px solid #ccc;
  }

  /* テンキーのレイアウト */
  .keypad {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    padding: 10px;
    flex-grow: 1;
  }

  .key {
    background: #fff;
    border: none;
    border-radius: 5px;
    font-size: 20px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 1px 2px rgba(0,0,0,0.2);
    cursor: pointer;
  }

  .key:active {
    background: #bbb;
  }

  .key.special { background: #adb4be; }
  .key.action { background: #007aff; color: white; }

  .btn-sm { padding: 4px 8px; font-size: 12px; }
</style>
</head>
<body>

<header>
  <strong>セル計算テスト</strong>
  <div>
    <button class="btn-sm" onclick="saveData()">保存</button>
    <button class="btn-sm" onclick="loadData()">復元</button>
  </div>
</header>

<div class="main">
  <table id="sheet">
    <thead>
      <tr>
        <th style="width:40px;">行</th>
        <th>2列目</th>
        <th>3列目</th>
        <th>4列目</th>
        <th>5列目</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<footer>
  <div class="status-bar">
    <span id="baseInfo">基準行：未設定</span>
    <div>
        <button class="btn-sm" onclick="clearInputs()">クリア</button>
    </div>
  </div>

  <div class="keypad">
    <button class="key" onclick="pressKey('7')">7</button>
    <button class="key" onclick="pressKey('8')">8</button>
    <button class="key" onclick="pressKey('9')">9</button>
    <button class="key special" onclick="pressKey('BS')">⌫</button>

    <button class="key" onclick="pressKey('4')">4</button>
    <button class="key" onclick="pressKey('5')">5</button>
    <button class="key" onclick="pressKey('6')">6</button>
    <button class="key special" onclick="pressKey('C')">C</button>

    <button class="key" onclick="pressKey('1')">1</button>
    <button class="key" onclick="pressKey('2')">2</button>
    <button class="key" onclick="pressKey('3')">3</button>
    <button class="key action" style="grid-row: span 2;" onclick="pressKey('NEXT')">Next</button>

    <button class="key" style="grid-column: span 2;" onclick="pressKey('0')">0</button>
    <button class="key" onclick="pressKey('.')">.</button>
  </div>
</footer>

<script>
  const tbody = document.querySelector("#sheet tbody");
  const baseInfo = document.getElementById("baseInfo");
  let baseRowIndex = null;
  let activeInput = null; // 現在選択中のinput

  const ROW_COUNT = 50;

  // 行生成
  for (let i = 0; i < ROW_COUNT; i++) {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${i + 1}</td>
      <td><input type="text" inputmode="none" class="col2"></td>
      <td><input type="text" inputmode="none" class="col3" readonly></td>
      <td><input type="text" inputmode="none" class="col4"></td>
      <td><input type="text" inputmode="none" class="col5"></td>
    `;
    tbody.appendChild(tr);

    // 全inputにフォーカスイベントを設定
    tr.querySelectorAll("input").forEach(input => {
      input.addEventListener("focus", (e) => {
        activeInput = e.target;
        tr.scrollIntoView({ behavior: "smooth", block: "center" });
      });
    });
  }

  // テンキー入力処理
  function pressKey(key) {
    if (!activeInput || activeInput.readOnly && key !== 'NEXT' && key !== 'C') return;

    if (key === 'BS') {
      activeInput.value = activeInput.value.slice(0, -1);
    } else if (key === 'C') {
      activeInput.value = "";
    } else if (key === 'NEXT') {
      moveToNext();
    } else if (key === '.') {
      if (!activeInput.value.includes('.')) activeInput.value += '.';
    } else {
      activeInput.value += key;
    }

    // 入力後の計算処理
    handleInputChange(activeInput);
  }

  function handleInputChange(input) {
    const tr = input.closest("tr");
    const rowIndex = tr.sectionRowIndex;
    
    if (input.classList.contains("col2")) {
      updateBaseRow(rowIndex);
      recalcBaseRow(rowIndex);
    } else if (input.classList.contains("col5") && rowIndex === baseRowIndex) {
      recalcBaseRow(rowIndex);
    } else if (input.classList.contains("col4")) {
      recalcDependentRow(rowIndex);
    }
  }

  function moveToNext() {
    const inputs = Array.from(document.querySelectorAll("input:not([readonly])"));
    const currentIndex = inputs.indexOf(activeInput);
    const nextInput = inputs[currentIndex + 1] || inputs[0];
    nextInput.focus();
  }

  function updateBaseRow(rowIndex) {
    baseRowIndex = rowIndex;
    [...tbody.rows].forEach((tr, i) => {
      const col5 = tr.querySelector(".col5");
      // 基準行以外は5列目を読み取り専用に（計算結果が入るため）
      if (i !== baseRowIndex) col5.readOnly = true;
      else col5.readOnly = false;
    });
    baseInfo.textContent = "基準行：" + (rowIndex + 1) + " 行目";
  }

  function recalcBaseRow(rowIndex) {
    const tr = tbody.rows[rowIndex];
    const v2 = parseFloat(tr.querySelector(".col2").value) || 0;
    const v5 = parseFloat(tr.querySelector(".col5").value) || 0;
    tr.querySelector(".col3").value = (v2 || v5) ? (v2 + v5).toFixed(2).replace(/\.?0+$/, "") : "";
  }

  function recalcDependentRow(rowIndex) {
    if (baseRowIndex === null || rowIndex <= baseRowIndex) return;
    const baseCol3 = parseFloat(tbody.rows[baseRowIndex].querySelector(".col3").value) || 0;
    const v4 = parseFloat(tbody.rows[rowIndex].querySelector(".col4").value) || 0;
    tbody.rows[rowIndex].querySelector(".col5").value = (baseCol3 - v4).toFixed(2).replace(/\.?0+$/, "");
  }

  // 保存・復元機能
  function saveData() {
    const data = [...tbody.rows].map(tr => ({
      col2: tr.querySelector(".col2").value,
      col3: tr.querySelector(".col3").value,
      col4: tr.querySelector(".col4").value,
      col5: tr.querySelector(".col5").value,
    }));
    localStorage.setItem("cellData", JSON.stringify(data));
    localStorage.setItem("baseRowIndex", baseRowIndex);
    alert("保存しました");
  }

  function loadData() {
    const json = localStorage.getItem("cellData");
    if (!json) return;
    const data = JSON.parse(json);
    data.forEach((row, i) => {
      if (!tbody.rows[i]) return;
      const tr = tbody.rows[i];
      tr.querySelector(".col2").value = row.col2;
      tr.querySelector(".col3").value = row.col3;
      tr.querySelector(".col4").value = row.col4;
      tr.querySelector(".col5").value = row.col5;
    });
    const savedBase = localStorage.getItem("baseRowIndex");
    if (savedBase !== "null") updateBaseRow(Number(savedBase));
  }

  function clearInputs() {
    if(!confirm("全ての入力をクリアしますか？")) return;
    [...tbody.rows].forEach(tr => {
      tr.querySelectorAll("input").forEach(i => i.value = "");
    });
    baseRowIndex = null;
    baseInfo.textContent = "基準行：未設定";
  }
</script>

</body>
</html>
