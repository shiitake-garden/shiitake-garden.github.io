<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>セル計算アプリ - ロジック刷新版</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background: #f0f0f2;
  }

  header {
    height: 50px;
    background: #333;
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 15px;
    flex-shrink: 0;
  }

  .main {
    flex-grow: 1;
    overflow-y: auto;
    background: #fff;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }

  thead {
    position: sticky;
    top: 0;
    background: #eee;
    z-index: 5;
  }

  th, td {
    border: 1px solid #ccc;
    padding: 0;
    text-align: center;
    font-size: 12px;
    height: 48px;
  }

  input {
    width: 100%;
    height: 100%;
    border: none;
    font-size: 18px;
    text-align: right;
    padding: 0 8px;
    background: transparent;
    outline: none;
    display: block;
  }

  input:focus {
    background: #fff9c4;
    box-shadow: inset 0 0 0 2px #ffeb3b;
  }

  /* 基準行の見た目 */
  tr.is-base { background-color: #e3f2fd; }
  tr.is-base td:nth-child(3) input { font-weight: bold; color: #007aff; }

  input[readonly] {
    background: #f5f5f5;
    color: #888;
  }

  footer {
    height: 340px;
    background: #d2d4d9;
    border-top: 1px solid #aaa;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }

  .status-bar {
    height: 35px;
    background: #fff;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 15px;
    font-size: 13px;
    border-bottom: 1px solid #bbb;
  }

  .keypad {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    padding: 12px;
    flex-grow: 1;
  }

  .key {
    background: #fff;
    border: none;
    border-radius: 8px;
    font-size: 22px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 0 #999;
    cursor: pointer;
  }

  .key:active { background: #bbb; transform: translateY(2px); box-shadow: none; }
  .key.special { background: #adb4be; }
  .key.next { background: #007aff; color: white; box-shadow: 0 2px 0 #004ead; }

  .btn-sm { padding: 4px 10px; border-radius: 4px; border: 1px solid #999; background: #fff; }
</style>
</head>
<body>

<header>
  <span>Calculation App</span>
  <div>
    <button class="btn-sm" onclick="saveData()">保存</button>
    <button class="btn-sm" onclick="loadData()">復元</button>
  </div>
</header>

<div class="main">
  <table id="sheet">
    <thead>
      <tr>
        <th style="width:40px;">行</th>
        <th>2列目</th>
        <th>3列目<br>(基準)</th>
        <th>4列目</th>
        <th>5列目</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<footer>
  <div class="status-bar">
    <span id="baseLabel" style="font-weight:bold; color:#007aff;">最新基準値: ---</span>
    <button class="btn-sm" onclick="clearAll()">リセット</button>
  </div>

  <div class="keypad">
    <button class="key" onclick="pressKey('7')">7</button>
    <button class="key" onclick="pressKey('8')">8</button>
    <button class="key" onclick="pressKey('9')">9</button>
    <button class="key special" onclick="pressKey('BS')">⌫</button>

    <button class="key" onclick="pressKey('4')">4</button>
    <button class="key" onclick="pressKey('5')">5</button>
    <button class="key" onclick="pressKey('6')">6</button>
    <button class="key special" onclick="pressKey('C')">C</button>

    <button class="key" onclick="pressKey('1')">1</button>
    <button class="key" onclick="pressKey('2')">2</button>
    <button class="key" onclick="pressKey('3')">3</button>
    <button class="key next" style="grid-row: span 2;" onclick="pressKey('NEXT')">Next</button>

    <button class="key" style="grid-column: span 2;" onclick="pressKey('0')">0</button>
    <button class="key" onclick="pressKey('.')">.</button>
  </div>
</footer>

<script>
  const tbody = document.querySelector("#sheet tbody");
  const baseLabel = document.getElementById("baseLabel");
  
  let latestBaseValue = null; // アプリ全体の最新基準値
  let activeInput = null;
  const ROW_COUNT = 50;

  // 初期テーブル生成
  for (let i = 0; i < ROW_COUNT; i++) {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${i + 1}</td>
      <td><input type="text" inputmode="none" class="col2"></td>
      <td><input type="text" inputmode="none" class="col3" readonly></td>
      <td><input type="text" inputmode="none" class="col4"></td>
      <td><input type="text" inputmode="none" class="col5"></td>
    `;
    tbody.appendChild(tr);

    tr.querySelectorAll("input").forEach(input => {
      input.addEventListener("focus", (e) => {
        activeInput = e.target;
        tr.scrollIntoView({ behavior: "smooth", block: "center" });
      });
    });
  }

  // ソフトキー入力
  function pressKey(key) {
    if (!activeInput) return;
    if (activeInput.readOnly && key !== 'NEXT' && key !== 'C') return;

    if (key === 'BS') {
      activeInput.value = activeInput.value.slice(0, -1);
    } else if (key === 'C') {
      activeInput.value = "";
    } else if (key === 'NEXT') {
      moveToNext();
      return;
    } else if (key === '.') {
      if (!activeInput.value.includes('.')) activeInput.value += '.';
    } else {
      activeInput.value += key;
    }

    calculateLogic(activeInput);
  }

  // コアロジック
  function calculateLogic(input) {
    const tr = input.closest("tr");
    const v2 = tr.querySelector(".col2");
    const v3 = tr.querySelector(".col3");
    const v4 = tr.querySelector(".col4");
    const v5 = tr.querySelector(".col5");

    // 1. 基準値の判定 (2列目と5列目が入力されているか)
    // 基準行の時、5列目は自ら入力するものなので readonly を解除する判断が必要
    // ただし、4列目がある行は5列目が自動計算になるため、
    // 「2列目に入力がある行」を基準候補として扱う
    if (v2.value !== "") {
        v5.readOnly = false; // 基準行候補は5列目を打てるようにする
        
        const val2 = parseFloat(v2.value) || 0;
        const val5 = parseFloat(v5.value) || 0;
        
        if (v5.value !== "") {
            const sum = val2 + val5;
            v3.value = formatNum(sum);
            latestBaseValue = sum; // 最新基準値を更新
            baseLabel.textContent = "最新基準値: " + v3.value;
            
            // 基準行としてマーク
            resetBaseStyles();
            tr.classList.add("is-base");
        }
    } else {
        // 2列目が空なら、基準行ではないので5列目は計算結果専用
        v5.readOnly = true;
    }

    // 2. 減算ロジック (4列目に入力がある場合)
    if (v4.value !== "" && latestBaseValue !== null) {
        const val4 = parseFloat(v4.value) || 0;
        v5.value = formatNum(latestBaseValue - val4);
        v5.readOnly = true; // 基準値からの計算結果なのでロック
    } else if (v4.value === "" && !tr.classList.contains("is-base")) {
        v5.value = "";
    }
  }

  function resetBaseStyles() {
    [...tbody.rows].forEach(r => r.classList.remove("is-base"));
  }

  function formatNum(num) {
    return num.toFixed(2).replace(/\.?0+$/, "");
  }

  // 移動ロジック
  function moveToNext() {
    if (!activeInput) return;
    const tr = activeInput.closest("tr");
    const idx = tr.sectionRowIndex;

    // 4列目を打っていたら次の行の4列目へ
    if (activeInput.classList.contains("col4")) {
      const nextTr = tbody.rows[idx + 1];
      if (nextTr) nextTr.querySelector(".col4").focus();
    } else {
      // それ以外は一般的な順序で移動
      const inputs = Array.from(document.querySelectorAll("input:not([readonly])"));
      const cIdx = inputs.indexOf(activeInput);
      if (inputs[cIdx + 1]) inputs[cIdx + 1].focus();
    }
  }

  // 保存・復元
  function saveData() {
    const data = [...tbody.rows].map(tr => ({
      c2: tr.querySelector(".col2").value,
      c3: tr.querySelector(".col3").value,
      c4: tr.querySelector(".col4").value,
      c5: tr.querySelector(".col5").value,
      isB: tr.classList.contains("is-base")
    }));
    localStorage.setItem("appData", JSON.stringify(data));
    alert("保存完了");
  }

  function loadData() {
    const json = localStorage.getItem("appData");
    if (!json) return;
    const data = JSON.parse(json);
    data.forEach((d, i) => {
      const tr = tbody.rows[i];
      tr.querySelector(".col2").value = d.c2;
      tr.querySelector(".col3").value = d.c3;
      tr.querySelector(".col4").value = d.c4;
      tr.querySelector(".col5").value = d.c5;
      if (d.isB) {
          tr.classList.add("is-base");
          latestBaseValue = parseFloat(d.c3);
          baseLabel.textContent = "最新基準値: " + d.c3;
      }
    });
  }

  function clearAll() {
    if (!confirm("全てクリアしますか？")) return;
    localStorage.clear();
    location.reload();
  }
</script>

</body>
</html>
