<body>

<section class="article-layout">
  <article class="article-main">
  <!--占い本体-->
  <head>
    <meta charset="UTF-8">
    <title>本格！野菜占い</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; line-height: 1.6; background-color: #f9fbf9; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .btn-container { display: flex; gap: 10px; margin-top: 20px; }
        button { flex: 1; padding: 15px; font-size: 1.1em; cursor: pointer; border-radius: 8px; border: none; transition: 0.2s; }
        .btn-yes { background-color: #ff6b6b; color: white; }
        .btn-no { background-color: #4ecdc4; color: white; }
        button:hover { opacity: 0.8; transform: translateY(-2px); }
        #result { display: none; }
        .job-tag { display: inline-block; background: #e0f2f1; padding: 5px 10px; border-radius: 5px; margin-right: 5px; font-size: 0.9em; }
    </style>
</head>
<body>

<div class="card">
    <div id="quiz-part">
        <h2 id="q-number">質問 1 / 15</h2>
        <p id="q-text">読み込み中...</p>
        <div class="btn-container">
            <button class="btn-yes" onclick="answer(true)">YES</button>
            <button class="btn-no" onclick="answer(false)">NO</button>
        </div>
    </div>

    <div id="result">
        <h2>あなたの野菜タイプは...</h2>
        <h1 id="res-name" style="color: #2e7d32;">野菜名</h1>
        <p id="res-desc">性格文がここに入ります。</p>
        <h3>向いている職業</h3>
        <div id="res-jobs"></div>
        <hr>
        <button onclick="location.reload()">もう一度占う</button>
    </div>
</div>
  
  
  
  
  <!--占いここまで-->
  </article>

<!--ここから占いスクリプト-->
<script>
    let questions = [];
    let vegetables = [];
    let currentIdx = 0;
    let userScore = { A: 0, H: 0, S: 0 };

    // CSVをパースする関数
    function parseCSV(text) {
        const lines = text.trim().split('\n');
        return lines.slice(1).map(line => line.split(',').map(s => s.trim()));
    }

    // データの読み込み
    async function init() {
        const [qRes, vRes] = await Promise.all([
            fetch('questions.csv').then(r => r.text()),
            fetch('vegetables.csv').then(r => r.text())
        ]);
        
        questions = parseCSV(qRes);
        vegetables = parseCSV(vRes);
        showQuestion();
    }

    function showQuestion() {
        if (currentIdx < questions.length) {
            document.getElementById('q-number').innerText = `質問 ${currentIdx + 1} / ${questions.length}`;
            document.getElementById('q-text').innerText = questions[currentIdx][1];
        } else {
            showResult();
        }
    }

    function answer(isYes) {
        const q = questions[currentIdx];
        const attr = q[2].charAt(0); // "A (外向)" から "A" を取得
        const points = isYes ? parseInt(q[3]) : parseInt(q[4]);
        userScore[attr] += points;

        currentIdx++;
        showQuestion();
    }

    function showResult() {
        document.getElementById('quiz-part').style.display = 'none';
        document.getElementById('result').style.display = 'block';

        let nearestVeg = null;
        let minDistance = Infinity;

        vegetables.forEach(v => {
            const vScore = { A: parseInt(v[5]), H: parseInt(v[6]), S: parseInt(v[7]) };
            // ユークリッド距離の計算
            const distance = Math.sqrt(
                Math.pow(userScore.A - vScore.A, 2) +
                Math.pow(userScore.H - vScore.H, 2) +
                Math.pow(userScore.S - vScore.S, 2)
            );

            if (distance < minDistance) {
                minDistance = distance;
                nearestVeg = v;
            }
        });

        document.getElementById('res-name').innerText = nearestVeg[0];
        document.getElementById('res-desc').innerText = nearestVeg[1];
        
        const jobsDiv = document.getElementById('res-jobs');
        [nearestVeg[2], nearestVeg[3], nearestVeg[4]].forEach(job => {
            if(job) jobsDiv.innerHTML += `<span class="job-tag">${job}</span>`;
        });
    }

    init();
</script>
  <!--ここまで占いスクリプト-->
