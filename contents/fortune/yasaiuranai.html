<script>
    let questions = [];
    let vegetables = [];
    let currentIdx = 0;
    let userScore = { A: 0, H: 0, S: 0 };

    // CSVをパースする関数
    function parseCSV(text) {
        const lines = text.trim().split('\n');
        return lines.slice(1).map(line => line.split(',').map(s => s.trim()));
    }

    // データの読み込み
    async function init() {
        const [qRes, vRes] = await Promise.all([
            fetch('questions.csv').then(r => r.text()),
            fetch('vegetables.csv').then(r => r.text())
        ]);
        
        questions = parseCSV(qRes);
        vegetables = parseCSV(vRes);
        showQuestion();
    }

    function showQuestion() {
        if (currentIdx < questions.length) {
            document.getElementById('q-number').innerText = `質問 ${currentIdx + 1} / ${questions.length}`;
            document.getElementById('q-text').innerText = questions[currentIdx][1];
        } else {
            showResult();
        }
    }

    function answer(isYes) {
        const q = questions[currentIdx];
        const attr = q[2].charAt(0); // "A (外向)" から "A" を取得
        const points = isYes ? parseInt(q[3]) : parseInt(q[4]);
        userScore[attr] += points;

        currentIdx++;
        showQuestion();
    }

function showResult() {
    document.getElementById('quiz-part').style.display = 'none';
    document.getElementById('result').style.display = 'block';

    // ★重要：ユーザーの点数(0-5)を、野菜のスケール(0-10)に変換して補正する
    // ※設問の配点を合計10点に修正したCSVを使う場合は、この「* 2」は不要ですが、
    // 配点を[1,2,2,2,3]に設定した場合は、この補正を入れると完璧に一致します。
    const normA = userScore.A; // 修正版CSVを使うならそのまま
    const normH = userScore.H; // 修正版CSVを使うならそのまま
    const normS = userScore.S; // 修正版CSVを使うならそのまま

    let nearestVeg = null;
    let minDistance = Infinity;

    vegetables.forEach(v => {
        // v[5]=A, v[6]=H, v[7]=S
        const vScore = { A: parseInt(v[5]), H: parseInt(v[6]), S: parseInt(v[7]) };
        
        // 距離計算の式を少しだけ変更
        const distance = Math.sqrt(
            Math.pow(normA - vScore.A, 2) +
            Math.pow(normH - vScore.H, 2) +
            Math.pow(normS - vScore.S, 2)
        );

        if (distance < minDistance) {
            minDistance = distance;
            nearestVeg = v;
        }
    });

  

    // 結果の表示
    document.getElementById('res-name').innerText = nearestVeg[0];
    document.getElementById('res-desc').innerText = nearestVeg[1];
    
    // 職業タグの表示
    const jobsDiv = document.getElementById('res-jobs');
    jobsDiv.innerHTML = ""; // 一旦クリア
    [nearestVeg[2], nearestVeg[3], nearestVeg[4]].forEach(job => {
        if(job) jobsDiv.innerHTML += `<span class="job-tag">${job}</span>`;
    });

    // ★ここが追加ポイント：詳細ページへのボタンを作成
    const vegId = nearestVeg[8]; // CSVの9列目（詳細ID）
    if (vegId) {
        const detailLinkSection = document.createElement('div');
        detailLinkSection.style.marginTop = "30px";
        detailLinkSection.innerHTML = `
            <div style="padding: 20px; background: #e8f5e9; border-radius: 10px; border: 1px solid #c8e6c9;">
                <p style="margin: 0 0 15px 0; font-weight: bold; color: #2e7d32;">
                    もっと詳しく知りたいですか？
                </p>
                <a href="detail.html?id=${vegId}" 
                   style="display: block; text-align: center; background: #4caf50; color: white; 
                          padding: 12px; text-decoration: none; border-radius: 5px; font-weight: bold;">
                    ${nearestVeg[0]}の性格深掘りと育て方
                </a>
            </div>
        `;
        document.getElementById('result').appendChild(detailLinkSection);
    }
}

    init();
</script>
