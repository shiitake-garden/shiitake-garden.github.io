<script>
    async function loadDetail() {
        // URLからIDを取得 (例: ?id=tomato)
        const params = new URLSearchParams(window.location.search);
        const targetId = params.get('id');

        const response = await fetch('vegetables.csv');
        const text = await response.text();
        const lines = text.trim().split('\n');
        
        // CSVから該当するIDの行を探す
        const data = lines.slice(1).map(line => line.split(',')).find(row => row[8] === targetId);

        if (data) {
            document.getElementById('page-title').innerText = data[0] + "の育て方と性格診断";
            document.getElementById('veg-name').innerText = data[0];
            document.getElementById('veg-desc').innerText = data[1];
            document.getElementById('veg-grow').innerText = data[9];
           
          const yourTrackingId = "loadmap-22";
          const shopKw = encodeURIComponent(data[10]);
          document.getElementById('ad-link').innerHTML = 
                `<a href="https://www.amazon.co.jp/s?k=${shopKw}&tag=${yourTrackingId}" target="_blank" style="color: #d32f2f; font-weight: bold;">
                Amazonで「${data[0]}」の栽培セットを見る</a>`;
        } else {
            document.getElementById('veg-name').innerText = "野菜が見つかりませんでした";
        }
    }
    loadDetail();
</script>
