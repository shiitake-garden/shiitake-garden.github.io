<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>カルティベーションラボ＜シイタケガーデン＞植物管理カレンダー</title>
  
<style>
/* --- 基本設定 --- */
body {
  margin: 0;
  padding: 0;
  font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
}

/* --- 上部コントロールエリア（印刷時は非表示） --- */
#controls, #buttons {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 10px;
  padding: 10px;
  border-bottom: 2px solid #ccc;
  background-color: #f9f9f9;
}

#left-controls, #center-controls, #right-controls {
  flex: 1 1 250px;
  margin-bottom: 10px;
}

/* --- 情報領域（A4横に最適化） --- */
#info-area {
  display: grid;
  grid-template-columns: 1fr 1.2fr 1.5fr; /* 比率を調整 */
  border-bottom: 3px solid #333;
  padding: 5mm;
  height: 60mm; /* 高さを固定 */
  box-sizing: border-box;
}

#info-month {
  display: flex;
  flex-direction: column;
  justify-content: center;
}

#info-month .logo {
  font-size: 20pt;
  font-weight: bold;
  color: #2e7d32;
}

#info-month .month-year {
  display: flex;
  align-items: baseline;
}

#info-month .month {
  font-size: 80pt;
  font-weight: bold;
  line-height: 1;
}

#info-month .year {
  font-size: 30pt;
  margin-left: 5mm;
}

#info-image {
  height: 50mm;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
#info-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 3mm;
}

#info-plants {
  font-size: 11pt;
  padding-left: 5mm;
  line-height: 1.5;
  overflow: hidden;
}

/* --- カレンダー本体 --- */
#calendar {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed; /* 列幅を固定 */
}

#calendar th, #calendar td {
  border: 1pt solid #aaa;
  vertical-align: top;
  box-sizing: border-box;
}

#calendar th {
  font-size: 14pt;
  height: 10mm;
  background-color: #f0f0f0;
}

/* 日付セルの高さ（A4横1枚に収めるための重要設定） */
#calendar td {
  height: 24mm; 
}

#calendar td div {
  font-weight: bold;
  font-size: 20pt;
  padding-left: 2mm;
  line-height: 1.2;
}

#calendar textarea {
  width: 100%;
  height: 12mm;
  border: none;
  resize: none;
  font-size: 9pt;
  background: transparent;
  overflow: hidden;
}

/* 曜日色 */
#calendar th:nth-child(1), #calendar td.sunday div { color: #d40000; }
#calendar th:nth-child(7), #calendar td.saturday div { color: #0040c0; }
#calendar th:nth-child(1) { background-color: #ffe5e5; }
#calendar th:nth-child(7) { background-color: #e5f0ff; }

/* フッター */
#footer-logo {
  text-align: center;
  margin-top: 2mm;
  font-size: 10pt;
  color: #666;
  page-break-before: avoid;   /* 直前での改ページを禁止 */
  break-before: avoid;
}

/* =========================================
   印刷専用設定（ここが解決の鍵です）
   ========================================= */
@media print {
  @page {
    size: A4 landscape; /* A4横を強制 */
    margin: 5mm;        /* 余白を最小化 */
  }

  body {
    width: 287mm;      /* A4横297mm - 余白10mm */
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* 入力補助UIは隠す */
  #controls, #buttons {
    display: none !important;
  }

  /* 印刷時は倍率を適用（必要に応じてJSで可変） */
  .print-container {
    transform: scale(var(--print-scale, 1.00));
    transform-origin: top left;
    page-break-inside: avoid;
    break-inside: avoid;
    display: block; /* gridやflexだと改ページ制御が効かない場合があるため */
  }

  /* テキストエリアのボーダーを消す */
  textarea {
    border: none !important;
    outline: none !important;
  }
}
</style>

</head>
<body>

<div id="controls">
  <div id="left-controls">
    <label>年：<input type="number" id="year" value="2026" style="width:60px;"></label>
    <label>月：
      <select id="month">
        <option value="1">1月</option><option value="2">2月</option><option value="3">3月</option>
        <option value="4">4月</option><option value="5">5月</option><option value="6">6月</option>
        <option value="7">7月</option><option value="8">8月</option><option value="9">9月</option>
        <option value="10">10月</option><option value="11">11月</option><option value="12">12月</option>
      </select>
    </label>
  </div>

  <div id="center-controls">
    <strong>植物選択</strong><br>
    <select id="plant-list" size="5" style="width:200px;"></select>
    <button onclick="addPlant()">登録</button>
  </div>

  <div id="right-controls">
    <strong>選択中（最大5）</strong>
    <ul id="selected-plants" style="font-size:12px;"></ul>
    <a href="https://shiitake-garden.github.io/">トップページ</a>
  </div>
</div>

<div id="buttons">
  <button onclick="updateAll()" style="padding:10px 20px;">1. カレンダー作成</button>
  <button onclick="window.print()" style="padding:10px 20px; background:#2e7d32; color:white; border:none; cursor:pointer;">2. 印刷する</button>

  <label style="margin-left:20px;">
    高さ微調整：
    <select id="print-scale" onchange="updatePrintScale()">
      <option value="0.8">80%</option>
      <option value="0.9">90%</option>
      <option value="0.95">95%</option>
      <option value="1.00" selected>100%</option>
      <option value="1.05">105%</option>
    </select>
  </label>
</div>

<div class="print-container">
    <div id="info-area">
      <div id="info-month">
        <div class="logo">Cultivation Lab</div>
        <div class="month-year">
          <div class="month" id="month-number">--</div>
          <div class="year" id="year-number">----</div>
        </div>
      </div>
      <div id="info-image"></div>
      <div id="info-plants"></div>
    </div>

    <table id="calendar"></table>

    <div id="footer-logo">
      <div>Cultivation Lab</div>   
      <div>Shiitake-Garden</div> 
    </div>
</div>

<script>
// --- CSV読み込み・植物選択ロジック（元のロジックを継承） ---
let plantData = [];
let selectedPlants = [];

async function loadPlantCSV() {
  try {
    const res = await fetch("/data/plant_tasks.csv");
    const text = await res.text();
    plantData = parseCSV(text);
    renderPlantList();
  } catch (e) {
    console.error("CSV読み込み失敗:", e);
  }
}

function parseCSV(csvText) {
  const lines = csvText.trim().split("\n");
  return lines.slice(1).map(line => {
    const cols = line.split(",");
    return {
      plant: cols[0],
      month: parseInt(cols[1].replace("月", ""), 10),
      task: cols[2],
      note: cols[3] || ""
    };
  });
}

function renderPlantList() {
  const names = [...new Set(plantData.map(d => d.plant))];
  const list = document.getElementById("plant-list");
  list.innerHTML = "";
  names.forEach(name => {
    const option = document.createElement("option");
    option.value = name;
    option.textContent = name;
    list.appendChild(option);
  });
}

function addPlant() {
  const plant = document.getElementById("plant-list").value;
  if (!plant || selectedPlants.includes(plant) || selectedPlants.length >= 5) return;
  selectedPlants.push(plant);
  updateSelectedPlantList();
}

function removePlant(name) {
  selectedPlants = selectedPlants.filter(p => p !== name);
  updateSelectedPlantList();
}

function updateSelectedPlantList() {
  const ul = document.getElementById("selected-plants");
  ul.innerHTML = selectedPlants.map(p => `<li>${p} <button onclick="removePlant('${p}')">×</button></li>`).join('');
}

function updateInfoArea(month) {
  const year = document.getElementById("year").value;
  document.getElementById("month-number").textContent = month;
  document.getElementById("year-number").textContent = year;
  document.getElementById("info-image").innerHTML = `<img src="/images/month/${month}.jpg" onerror="this.style.display='none'">`;

  const list = document.getElementById("info-plants");
  const tasks = plantData.filter(d => d.month === month && selectedPlants.includes(d.plant));
  list.innerHTML = tasks.map(t => `<div><strong>${t.plant}</strong>：${t.task}${t.note ? '【'+t.note+'】':''}</div>`).join('');
}

function generateCalendar(year, month) {
  const table = document.getElementById("calendar");
  const firstDay = new Date(year, month - 1, 1).getDay();
  const lastDate = new Date(year, month, 0).getDate();
  
  let html = '<tr><th>日</th><th>月</th><th>火</th><th>水</th><th>木</th><th>金</th><th>土</th></tr><tr>';
  
  for (let i = 0; i < firstDay; i++) html += '<td></td>';

  for (let d = 1; d <= lastDate; d++) {
    const dayOfWeek = (firstDay + d - 1) % 7;
    const cls = dayOfWeek === 0 ? "sunday" : dayOfWeek === 6 ? "saturday" : "";
    html += `<td class="${cls}"><div>${d}</div><textarea></textarea></td>`;
    if ((firstDay + d) % 7 === 0 && d !== lastDate) html += '</tr><tr>';
  }
  
  html += '</tr>';
  table.innerHTML = html;
}

function updatePrintScale() {
  const scale = document.getElementById("print-scale").value;
  document.documentElement.style.setProperty("--print-scale", scale);
}

async function updateAll() {
  if (plantData.length === 0) await loadPlantCSV();
  const year = Number(document.getElementById("year").value);
  const month = Number(document.getElementById("month").value);
  updateInfoArea(month);
  generateCalendar(year, month);
}

window.onload = loadPlantCSV;
</script>

</body>
</html>
