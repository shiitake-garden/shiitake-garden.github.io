<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>シイタケガーデン 植物管理カレンダー（6段固定版）</title>
  
<style>
/* --- 基本設定 --- */
body {
  margin: 0;
  padding: 0;
  font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
}

/* --- コントロールエリア（印刷非表示） --- */
#controls, #buttons {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 10px;
  padding: 15px;
  border-bottom: 2px solid #ccc;
  background-color: #f9f9f9;
}

#left-controls, #center-controls, #right-controls {
  flex: 1 1 250px;
  margin-bottom: 10px;
}

/* --- 情報領域（高さを少し抑えて6段に対応） --- */
#info-area {
  display: grid;
  grid-template-columns: 1fr 1.2fr 1.5fr;
  border-bottom: 3px solid #333;
  padding: 3mm 5mm;
  height: 50mm; /* 60mmから50mmに短縮 */
  box-sizing: border-box;
}

#info-month {
  display: flex;
  flex-direction: column;
  justify-content: center;
}

#info-month .logo {
  font-size: 18pt;
  font-weight: bold;
  color: #2e7d32;
}

#info-month .month {
  font-size: 65pt;
  font-weight: bold;
  line-height: 1;
}

#info-month .year {
  font-size: 24pt;
  margin-left: 3mm;
}

#info-image {
  height: 42mm;
  display: flex;
  align-items: center;
  justify-content: center;
}
#info-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 2mm;
}

#info-plants {
  font-size: 10pt;
  padding-left: 5mm;
  line-height: 1.4;
}

/* --- カレンダー本体 --- */
#calendar {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}

#calendar th, #calendar td {
  border: 1pt solid #aaa;
  vertical-align: top;
  box-sizing: border-box;
}

#calendar th {
  font-size: 12pt;
  height: 8mm; /* 少し短縮 */
  background-color: #f0f0f0;
}

/* 日付セルの高さ：6段(20mm×6=120mm)を確保 */
#calendar td {
  height: 20mm; 
}

#calendar td div {
  font-weight: bold;
  font-size: 16pt;
  padding-left: 2mm;
  line-height: 1.1;
}

#calendar textarea {
  width: 100%;
  height: 10mm;
  border: none;
  resize: none;
  font-size: 8.5pt;
  background: transparent;
  overflow: hidden;
}

/* 曜日色 */
#calendar th:nth-child(1), #calendar td.sunday div { color: #d40000; }
#calendar th:nth-child(7), #calendar td.saturday div { color: #0040c0; }

/* フッター */
#footer-logo {
  text-align: center;
  padding: 2mm 0;
  font-size: 10pt;
  color: #666;
}

/* =========================================
    印刷設定
   ========================================= */
@media print {
  @page {
    size: A4 landscape;
    margin: 5mm;
  }

  body {
    width: 287mm;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  #controls, #buttons {
    display: none !important;
  }

  .print-container {
    transform: scaleY(var(--print-scale, 1.00));
    transform-origin: top center;
    page-break-inside: avoid;
    break-inside: avoid;
    display: block;
    width: 100%;
  }
}
</style>

</head>
<body>

<div id="controls">
  <div id="left-controls">
    <label>年：<input type="number" id="year" value="2026" style="width:70px;"></label>
    <label>月：
      <select id="month">
        <option value="1">1月</option><option value="2">2月</option><option value="3">3月</option>
        <option value="4">4月</option><option value="5" selected>5月</option><option value="6">6月</option>
        <option value="7">7月</option><option value="8">8月</option><option value="9">9月</option>
        <option value="10">10月</option><option value="11">11月</option><option value="12">12月</option>
      </select>
    </label>
  </div>
  <div id="center-controls">
    <strong>植物選択</strong><br>
    <select id="plant-list" size="5" style="width:200px; margin-top:5px;"></select>
    <button onclick="addPlant()">追加</button>
  </div>
  <div id="right-controls">
    <strong>選択中(最大5)</strong>
    <ul id="selected-plants" style="font-size:12px;"></ul>
  </div>
　 <div id="Link">  
    <a href="/column/column_syosinsya.html">TOP</a>
  </div>
</div>

<div id="buttons">
  <div>
    <button onclick="updateAll()" style="padding:10px 20px; font-weight:bold;">1. カレンダー更新</button>
    <button onclick="window.print()" style="padding:10px 20px; background:#2e7d32; color:white; border:none; font-weight:bold; margin-left:10px;">2. 印刷</button>
    A4横に最適化されています。うまく印刷されない場合は、ブラウザの印刷設定を確認してください。
  </div>
  <label>
    <strong>高さ微調整：</strong>
    <select id="print-scale" onchange="updatePrintScale()">
      <option value="0.90">90%</option>
      <option value="0.95">95%</option>
      <option value="1.00" selected>100% (推奨)</option>
    </select>
  </label>
</div>

<div class="print-container">
    <div id="info-area">
      <div id="info-month">
        <div class="logo">Cultivation Lab</div>
        <div style="display: flex; align-items: baseline;">
          <div class="month" id="month-number">--</div>
          <div class="year" id="year-number">----</div>
        </div>
      </div>
      <div id="info-image"></div>
      <div id="info-plants"></div>
    </div>

    <table id="calendar"></table>

    <div id="footer-logo">
      <div>Cultivation Lab</div>   
      <div>Shiitake-Garden</div>  
    </div>
</div>

<script>
let plantData = [];
let selectedPlants = [];

async function loadPlantCSV() {
  try {
    const res = await fetch("/data/plant_tasks.csv");
    const text = await res.text();
    plantData = parseCSV(text);
  } catch (e) {
    plantData = [{plant: "サンプル", month: 5, task: "サンプルの作業"}];
  }
  renderPlantList();
}

function parseCSV(csvText) {
  const lines = csvText.trim().split("\n");
  return lines.slice(1).map(line => {
    const cols = line.split(",");
    return { plant: cols[0], month: parseInt(cols[1], 10), task: cols[2], note: cols[3] || "" };
  });
}

function renderPlantList() {
  const names = [...new Set(plantData.map(d => d.plant))];
  const list = document.getElementById("plant-list");
  list.innerHTML = "";
  names.forEach(name => {
    const option = document.createElement("option");
    option.value = name;
    option.textContent = name;
    list.appendChild(option);
  });
}

function addPlant() {
  const plant = document.getElementById("plant-list").value;
  if (!plant || selectedPlants.includes(plant) || selectedPlants.length >= 5) return;
  selectedPlants.push(plant);
  updateSelectedPlantList();
}

function removePlant(name) {
  selectedPlants = selectedPlants.filter(p => p !== name);
  updateSelectedPlantList();
}

function updateSelectedPlantList() {
  const ul = document.getElementById("selected-plants");
  ul.innerHTML = selectedPlants.map(p => `<li>${p} <button onclick="removePlant('${p}')">×</button></li>`).join('');
}

function updateInfoArea(month) {
  const year = document.getElementById("year").value;
  document.getElementById("month-number").textContent = month;
  document.getElementById("year-number").textContent = year;
  document.getElementById("info-image").innerHTML = `<img src="/images/month/${month}.jpg" onerror="this.src='https://via.placeholder.com/300x200?text=Month+Image'">`;
  const list = document.getElementById("info-plants");
  const tasks = plantData.filter(d => d.month === month && selectedPlants.includes(d.plant));
  list.innerHTML = tasks.map(t => `<div><strong>${t.plant}</strong>：${t.task}</div>`).join('');
}

/**
 * 常に6段のカレンダーを生成するロジック
 */
function generateCalendar(year, month) {
  const table = document.getElementById("calendar");
  const firstDay = new Date(year, month - 1, 1).getDay();
  const lastDate = new Date(year, month, 0).getDate();
  
  let html = '<thead><tr><th>日</th><th>月</th><th>火</th><th>水</th><th>木</th><th>金</th><th>土</th></tr></thead><tbody><tr>';
  
  let dayCount = 0;
  // 前月の空セル
  for (let i = 0; i < firstDay; i++) {
    html += '<td></td>';
    dayCount++;
  }

  // 日付セル
  for (let d = 1; d <= lastDate; d++) {
    const dayOfWeek = (firstDay + d - 1) % 7;
    const cls = dayOfWeek === 0 ? "sunday" : dayOfWeek === 6 ? "saturday" : "";
    html += `<td class="${cls}"><div>${d}</div><textarea></textarea></td>`;
    dayCount++;
    if (dayCount % 7 === 0 && d !== lastDate) html += '</tr><tr>';
  }
  
  // 常に6行(42セル)にするための空セル埋め
  const totalCellsNeeded = 42; 
  while (dayCount < totalCellsNeeded) {
    if (dayCount % 7 === 0) html += '</tr><tr>';
    html += '<td></td>';
    dayCount++;
  }

  html += '</tr></tbody>';
  table.innerHTML = html;
}

function updatePrintScale() {
  const scale = document.getElementById("print-scale").value;
  document.documentElement.style.setProperty("--print-scale", scale);
}

async function updateAll() {
  const year = Number(document.getElementById("year").value);
  const month = Number(document.getElementById("month").value);
  updateInfoArea(month);
  generateCalendar(year, month);
}

window.onload = loadPlantCSV;
</script>

</body>
</html>
