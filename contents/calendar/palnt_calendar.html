<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>シイタケガーデン 植物管理カレンダー</title>
  
<style>
/* --- 基本設定 --- */
body {
  margin: 0;
  padding: 0;
  font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
}

/* --- コントロールエリア（印刷非表示） --- */
#controls, #buttons {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 10px;
  padding: 15px;
  border-bottom: 2px solid #ccc;
  background-color: #f9f9f9;
}

#left-controls, #center-controls, #right-controls {
  flex: 1 1 250px;
  margin-bottom: 10px;
}

/* --- 情報領域 --- */
#info-area {
  display: grid;
  grid-template-columns: 1fr 1.2fr 1.5fr;
  border-bottom: 3px solid #333;
  padding: 5mm;
  height: 60mm; 
  box-sizing: border-box;
}

#info-month {
  display: flex;
  flex-direction: column;
  justify-content: center;
}

#info-month .logo {
  font-size: 20pt;
  font-weight: bold;
  color: #2e7d32;
}

#info-month .month {
  font-size: 80pt;
  font-weight: bold;
  line-height: 1;
}

#info-month .year {
  font-size: 30pt;
  margin-left: 5mm;
}

#info-image {
  height: 50mm;
  display: flex;
  align-items: center;
  justify-content: center;
}
#info-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 3mm;
}

#info-plants {
  font-size: 11pt;
  padding-left: 5mm;
  line-height: 1.5;
}

/* --- カレンダー本体 --- */
#calendar {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}

#calendar th, #calendar td {
  border: 1pt solid #aaa;
  vertical-align: top;
  box-sizing: border-box;
}

#calendar th {
  font-size: 14pt;
  height: 10mm;
  background-color: #f0f0f0;
}

#calendar td {
  height: 24mm; 
}

#calendar td div {
  font-weight: bold;
  font-size: 18pt;
  padding-left: 2mm;
  line-height: 1.2;
}

#calendar textarea {
  width: 100%;
  height: 12mm;
  border: none;
  resize: none;
  font-size: 9pt;
  background: transparent;
  overflow: hidden;
}

/* 曜日色 */
#calendar th:nth-child(1), #calendar td.sunday div { color: #d40000; }
#calendar th:nth-child(7), #calendar td.saturday div { color: #0040c0; }

/* フッター */
#footer-logo {
  text-align: center;
  padding: 5mm 0;
  font-size: 10pt;
  color: #666;
}

/* =========================================
    印刷設定
   ========================================= */
@media print {
  @page {
    size: A4 landscape;
    margin: 5mm;
  }

  body {
    width: 287mm;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  #controls, #buttons {
    display: none !important;
  }

  /* 倍率調整のコア設定 
     scaleYにより、横幅を変えずに「高さ」だけを微調整します 
  */
  .print-container {
    transform: scaleY(var(--print-scale, 1.00));
    transform-origin: top center;
    page-break-inside: avoid;
    break-inside: avoid;
    display: block;
    width: 100%;
  }

  textarea {
    border: none !important;
    outline: none !important;
  }
}
</style>

</head>
<body>

<div id="controls">
  <div id="left-controls">
    <label>年：<input type="number" id="year" value="2026" style="width:70px;"></label>
    <label>月：
      <select id="month">
        <option value="1">1月</option><option value="2" selected>2月</option><option value="3">3月</option>
        <option value="4">4月</option><option value="5">5月</option><option value="6">6月</option>
        <option value="7">7月</option><option value="8">8月</option><option value="9">9月</option>
        <option value="10">10月</option><option value="11">11月</option><option value="12">12月</option>
      </select>
    </label>
  </div>

  <div id="center-controls">
    <strong>植物選択</strong><br>
    <select id="plant-list" size="5" style="width:200px; margin-top:5px;"></select>
    <button onclick="addPlant()">選択リストに追加</button>
  </div>

  <div id="right-controls">
    <strong>選択中（最大5）</strong>
    <ul id="selected-plants" style="font-size:12px; margin-top:5px;"></ul>
  </div>
</div>

<div id="buttons">
  <div>
    <button onclick="updateAll()" style="padding:10px 20px; font-weight:bold; cursor:pointer;">1. カレンダー更新</button>
    <button onclick="window.print()" style="padding:10px 20px; background:#2e7d32; color:white; border:none; font-weight:bold; cursor:pointer; margin-left:10px;">2. 印刷プレビュー</button>
  </div>

  <label>
    <strong>【重要】1枚に収めるための高さ微調整：</strong>
    <select id="print-scale" onchange="updatePrintScale()" style="padding:5px; border:2px solid #2e7d32;">
      <option value="0.85">85% (かなり縮める)</option>
      <option value="0.90">90% (少し縮める)</option>
      <option value="0.95">95% (微調整)</option>
      <option value="1.00" selected>100% (標準)</option>
      <option value="1.05">105% (少し伸ばす)</option>
    </select>
  </label>
</div>

<div class="print-container">
    <div id="info-area">
      <div id="info-month">
        <div class="logo">Cultivation Lab</div>
        <div style="display: flex; align-items: baseline;">
          <div class="month" id="month-number">--</div>
          <div class="year" id="year-number">----</div>
        </div>
      </div>
      <div id="info-image"></div>
      <div id="info-plants"></div>
    </div>

    <table id="calendar"></table>

    <div id="footer-logo">
      <div>Cultivation Lab</div>  
      <div>Shiitake-Garden</div> 
    </div>
</div>

<script>
let plantData = [];
let selectedPlants = [];

// CSVの読み込み (GitHub Pages等のパスに合わせる)
async function loadPlantCSV() {
  try {
    const res = await fetch("/data/plant_tasks.csv");
    if(!res.ok) throw new Error("CSV not found");
    const text = await res.text();
    plantData = parseCSV(text);
    renderPlantList();
  } catch (e) {
    console.error("CSV読み込み失敗、またはファイルが存在しません:", e);
    // デモ用データ
    plantData = [
      {plant: "シイタケ", month: 2, task: "散水・温度管理", note: "乾燥注意"},
      {plant: "マイタケ", month: 2, task: "換気", note: "湿度維持"}
    ];
    renderPlantList();
  }
}

function parseCSV(csvText) {
  const lines = csvText.trim().split("\n");
  return lines.slice(1).map(line => {
    const cols = line.split(",");
    return {
      plant: cols[0],
      month: parseInt(cols[1], 10),
      task: cols[2],
      note: cols[3] || ""
    };
  });
}

function renderPlantList() {
  const names = [...new Set(plantData.map(d => d.plant))];
  const list = document.getElementById("plant-list");
  list.innerHTML = "";
  names.forEach(name => {
    const option = document.createElement("option");
    option.value = name;
    option.textContent = name;
    list.appendChild(option);
  });
}

function addPlant() {
  const plant = document.getElementById("plant-list").value;
  if (!plant || selectedPlants.includes(plant) || selectedPlants.length >= 5) return;
  selectedPlants.push(plant);
  updateSelectedPlantList();
}

function removePlant(name) {
  selectedPlants = selectedPlants.filter(p => p !== name);
  updateSelectedPlantList();
}

function updateSelectedPlantList() {
  const ul = document.getElementById("selected-plants");
  ul.innerHTML = selectedPlants.map(p => `<li>${p} <button onclick="removePlant('${p}')">消去</button></li>`).join('');
}

function updateInfoArea(month) {
  const year = document.getElementById("year").value;
  document.getElementById("month-number").textContent = month;
  document.getElementById("year-number").textContent = year;
  document.getElementById("info-image").innerHTML = `<img src="/images/month/${month}.jpg" onerror="this.src='https://via.placeholder.com/300x200?text=Month+Image'">`;

  const list = document.getElementById("info-plants");
  const tasks = plantData.filter(d => d.month === month && selectedPlants.includes(d.plant));
  list.innerHTML = tasks.map(t => `<div><strong>${t.plant}</strong>：${t.task} <span style="font-size:9pt; color:#666;">${t.note}</span></div>`).join('');
}

function generateCalendar(year, month) {
  const table = document.getElementById("calendar");
  const firstDay = new Date(year, month - 1, 1).getDay();
  const lastDate = new Date(year, month, 0).getDate();
  
  let html = '<thead><tr><th>日</th><th>月</th><th>火</th><th>水</th><th>木</th><th>金</th><th>土</th></tr></thead><tbody><tr>';
  
  for (let i = 0; i < firstDay; i++) html += '<td></td>';

  for (let d = 1; d <= lastDate; d++) {
    const dayOfWeek = (firstDay + d - 1) % 7;
    const cls = dayOfWeek === 0 ? "sunday" : dayOfWeek === 6 ? "saturday" : "";
    html += `<td class="${cls}"><div>${d}</div><textarea></textarea></td>`;
    if ((firstDay + d) % 7 === 0 && d !== lastDate) html += '</tr><tr>';
  }
  
  // 最終行の空セル埋め
  const remaining = (firstDay + lastDate) % 7;
  if (remaining !== 0) {
    for (let i = remaining; i < 7; i++) html += '<td></td>';
  }

  html += '</tr></tbody>';
  table.innerHTML = html;
}

function updatePrintScale() {
  const scale = document.getElementById("print-scale").value;
  document.documentElement.style.setProperty("--print-scale", scale);
}

async function updateAll() {
  const year = Number(document.getElementById("year").value);
  const month = Number(document.getElementById("month").value);
  updateInfoArea(month);
  generateCalendar(year, month);
}

window.onload = loadPlantCSV;
</script>

</body>
</html>
