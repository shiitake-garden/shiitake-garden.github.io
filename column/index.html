<!doctype html>
<html lang="ja">

<body>
<!--ここから記事-->
<section class="article-layout">

  <article class="article-main">
<header>
<h2>コラム一覧</h2>
</header>
<ul>
  {% assign column_pages = site.pages | where_exp: "item", "item.path contains 'column/'" %}
  {% for post in column_pages %}
    {% unless post.path == "column/index.html" %}
      <li>
        <a href="{{ post.url | relative_url }}">
          {{ post.title | default: "無題の記事" }}
        </a>
      </li>
    {% endunless %}
  {% endfor %}
</ul>


    
  </article>

  <!--ここからサイドバー-->
  <aside class="article-sidebar">

    <div class="sidebar-block">
      <h3>広告</h3>
      <!-- AdSense広告枠 -->
<!-- admax -->
<script src="https://adm.shinobi.jp/s/1c5297a1f21c0a05e42610c2f423b8ef"></script>
<!-- admax -->
    </div>

  </aside>

</section>

</body>
</html>
