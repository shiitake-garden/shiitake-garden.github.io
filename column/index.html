<!doctype html>

<body>
<!--ここから記事-->
<section class="article-layout">
  <article class="article-main">


<header>
      <h1>コラム一覧</h1>
</header>


<ul>
  {%- assign column_pages = site.pages 
      | where_exp: "p", "p.url startswith '/column/' and p.url != '/column/'" 
      | sort: "name" -%}
  {%- for p in column_pages -%}
    <li>
      <a href="{{ p.url |_url }}{{ p.title | default: p.name }}</a>
      {%- if p.date -%}<small>（{{ p.date | date: "%Y-%m-%d" }}）</small>{%- endif -%}
    </li>
  {%- endfor -%}
</ul>

    
  </article>
  <!--ここからサイドバー-->
